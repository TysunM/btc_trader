[project]
name = "itb-btcusdt"
version = "0.1.0"
description = "Intelligent Trading Bot port — BTCUSDT spot, signals-only v1 + quant improvements pass"
requires-python = ">=3.12,<3.13"
dependencies = [
    "apscheduler>=3.10",
    "click>=8.1",
    "tqdm>=4.66",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "pyarrow>=17.0",
    "python-binance>=1.0.19,<1.1",
    "numba>=0.60",
    "pandas-ta>=0.3.14b0",
    "scikit-learn>=1.5,<2.0",
    "lightgbm>=4.5,<5.0",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "joblib>=1.4",
    "json5>=0.9",
    "dateparser>=1.2",
    "pytz>=2024.1",
]

[project.optional-dependencies]
nn = [
    "tensorflow>=2.17,<2.21",
    "keras>=3.5,<3.14",
]
reporting = [
    "backtesting>=0.3.3",
    "bokeh>=3.4",
]
diagram = [
    "matplotlib>=3.9",
    "seaborn>=0.13",
]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
]

[tool.uv]
default-groups = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "inputs", "outputs", "scripts", "service", "reporting", "v2"]

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests that hit real Binance data (run manually, not in fast unit runs)",
]
